<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>RAZEN · เข้าสู่ระบบ</title>
<meta name="description" content="ระบบปิดพนักงาน RAZEN"/>
<meta name="theme-color" content="#0b0b0d"/>
<meta name="robots" content="noindex,nofollow"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --gold: #d4af37;
    --gold-2: #f3e0a0;
    --ink: #f6f1ea;
    --mute: #b7a99a;
    --bg: #0b0b0d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.5 Anuphan, system-ui, sans-serif; }
  .stage {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 28px 18px 40px;
    background:
      radial-gradient(50% 40% at 50% 0%, rgba(212,175,55,.16), transparent 58%),
      #0b0b0d;
  }
  .card {
    width: min(420px, 100%);
    text-align: center;
  }
  .brand {
    font-family: Sora, sans-serif;
    letter-spacing: .28em;
    font-size: 13px;
    color: var(--gold);
    margin-bottom: 6px;
  }
  .kicker { color: var(--mute); font-size: 13px; margin: 0 0 22px; }
  .host {
    position: relative;
    border-radius: 28px;
    overflow: hidden;
    aspect-ratio: 3 / 4;
    background: #111;
    box-shadow: 0 24px 60px rgba(0,0,0,.45), 0 0 0 1px rgba(212,175,55,.28);
  }
  .host video, .host img {
    width: 100%; height: 100%; object-fit: cover; object-position: top;
    display: block;
  }
  .bubble {
    position: absolute; left: 14px; right: 14px; bottom: 14px;
    background: rgba(12,10,8,.78);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(212,175,55,.35);
    border-radius: 16px;
    padding: 12px 14px;
    font-size: 15px;
    text-align: left;
  }
  .bubble b { color: var(--gold-2); font-weight: 600; }
  .go {
    margin-top: 20px;
    width: 100%; min-height: 52px;
    border: 0; border-radius: 999px; cursor: pointer;
    background: linear-gradient(180deg, #f3e0a0, #b8892a);
    color: #1a1206;
    font: 650 16px/1 Anuphan, sans-serif;
    box-shadow: 0 10px 28px rgba(212,175,55,.28);
  }
  .go:active { transform: translateY(1px); }
  .gate {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(8,8,10,.86);
    display: none; place-items: center; padding: 24px;
  }
  .gate.on { display: grid; }
  .gate-card { width: min(360px, 100%); text-align: center; }
  .gate-card .host { aspect-ratio: 3 / 4; max-height: 56dvh; margin-inline: auto; }
  .say {
    margin: 18px 0 8px;
    font-size: 22px;
    font-weight: 700;
    color: var(--gold-2);
  }
  .bar {
    height: 3px; border-radius: 99px; background: #222;
    overflow: hidden; margin-top: 16px;
  }
  .bar i {
    display: block; height: 100%; width: 0;
    background: var(--gold);
    animation: load 2.8s ease forwards;
  }
  @keyframes load { to { width: 100%; } }
  @media (prefers-reduced-motion: reduce) {
    .bar i { animation: none; width: 100%; }
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="card">
      <p class="brand">RAZEN</p>
      <p class="kicker">ระบบปิดสำหรับพนักงาน · เข้าสู่ระบบ</p>
      <div class="host">
        <video autoplay muted loop playsinline poster="/landing/hostess.jpg">
          <source src="/landing/hostess.mp4" type="video/mp4"/>
        </video>
        <p class="bubble">สวัสดีค่ะ<br><b>กดเข้าสู่ระบบได้เลยนะคะ</b></p>
      </div>
      <button class="go" id="enter" type="button">เข้าสู่ระบบ</button>
    </div>
  </main>

  <div class="gate" id="gate" aria-live="polite">
    <div class="gate-card">
      <div class="host">
        <video id="talk" muted loop playsinline poster="/landing/hostess-talk.jpg">
          <source src="/landing/talk.mp4" type="video/mp4"/>
        </video>
        <p class="bubble" id="line">ยินดีต้อนรับค่ะ<br><b>รวยรวย เฮงเฮงนะคะ</b></p>
      </div>
      <p class="say">ยินดีต้อนรับค่ะ</p>
      <p class="kicker">กำลังพาเข้าโต๊ะ…</p>
      <div class="bar"><i></i></div>
    </div>
  </div>

  <script>
    var LINE = "ยินดีต้อนรับค่ะ รวยรวย เฮงเฮงนะคะ";
    function speak() {
      try {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(LINE);
        u.lang = "th-TH";
        u.rate = 0.95;
        var voices = window.speechSynthesis.getVoices();
        var th = voices.find(function (v) { return v.lang && v.lang.indexOf("th") === 0; });
        if (th) u.voice = th;
        window.speechSynthesis.speak(u);
      } catch (e) {}
    }
    if (window.speechSynthesis) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = function () { window.speechSynthesis.getVoices(); };
    }
    document.getElementById("enter").addEventListener("click", function () {
      var gate = document.getElementById("gate");
      var talk = document.getElementById("talk");
      gate.classList.add("on");
      try { talk.play(); } catch (e) {}
      speak();
      setTimeout(function () {
        window.top.location.href = "/desk";
      }, 2800);
    });
  </script>
</body>
</html>
